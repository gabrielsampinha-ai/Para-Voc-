<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para Duda ❤️</title>

<style>
body{
 margin:0;
 font-family: Georgia, serif;
 background: radial-gradient(circle,#120008,#000);
 color:#fff;
 overflow:hidden;
 animation:pulse 4s infinite;
}
@keyframes pulse{
0%,100%{background-size:100% 100%;}
50%{background-size:115% 115%;}
}

.card{
 margin:12px;
 padding:18px;
 border-radius:20px;
 background:rgba(0,0,0,0.75);
 box-shadow:0 0 40px rgba(255,0,100,0.6);
 text-align:center;
}

h1{color:#ff4d6d;}

.poem{white-space:pre-line;font-size:16px;}

button{
margin-top:20px;
padding:12px;
background:#ff4d6d;
border:none;
border-radius:10px;
color:#fff;
font-size:16px;
}

#carta{
display:none;
margin-top:20px;
background:#fff0f5;
color:#5a0a2c;
padding:15px;
border-radius:15px;
font-family:cursive;
}

.heart{
position:absolute;
color:#ff4d6d;
animation:up linear infinite;
}
@keyframes up{
from{transform:translateY(100vh);}
to{transform:translateY(-10vh);}
}

.cupid{
position:absolute;
font-size:22px;
animation:fly 6s linear infinite;
}
@keyframes fly{
0%{left:-10%;top:30%;}
100%{left:110%;top:50%;}
}

#brokenHeart{
position:fixed;
font-size:70px;
top:50%;
left:50%;
transform:translate(-50%,-50%);
display:none;
animation:break 1s forwards;
}
@keyframes break{
0%{transform:scale(1);}
50%{transform:scale(1.6) rotate(15deg);}
100%{transform:scale(0);opacity:0;}
}

/* chuva leve */
.rain{
 position:absolute;
 width:2px;
 height:15px;
 background:#aaa;
 animation:rain 1s linear infinite;
}
@keyframes rain{
from{transform:translateY(-10vh);}
to{transform:translateY(100vh);}
}
</style>
</head>

<body>

<!-- música estilo romântico (substituível) -->
<audio autoplay loop>
<source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3">
</audio>

<!-- SUA VOZ -->
<audio id="voz">
<source src="audio.mp3" type="audio/mpeg">
</audio>

<div class="card">
<h1>💖 Maria Eduarda 💖</h1>

<div class="poem" id="poem"></div>

<button onclick="abrirTudo()">Clique aqui</button>

<div id="carta"></div>

</div>

<div id="brokenHeart">💔</div>

<script>

// TEXTO DA CARTA (cinematográfico)
const cartaTexto = `Maria Eduarda...

Boa tarde, Duda.

Eu pensei muito antes de escrever isso…
mas quando digo muito, é porque eu realmente voltei várias vezes nos mesmos pensamentos, nas mesmas situações, tentando entender melhor tudo que aconteceu… e principalmente, tentando sentir o que você sentiu.
E foi aí que eu percebi que eu precisava escrever.
Porque tem coisas que o silêncio não resolve…
e o que eu sinto por você não cabe no silêncio.
Talvez isso seja inesperado pra você.
Talvez você nem estivesse esperando algo assim.
Mas mesmo estando longe, mesmo com a distância entre a gente…
isso foi a forma mais sincera que eu encontrei de chegar até você.
Faz um tempo que eu não escrevo desse jeito.
Mas dizem que o maior combustível de um escritor é o amor…
e eu entendi isso agora.
Porque foi exatamente isso que me trouxe até aqui.
Eu amo você.
E eu gosto de você de verdade.
Não é algo superficial, nem momentâneo…
é algo que foi crescendo, se construindo aos poucos…
e que hoje é importante pra mim.
E justamente por isso… dói.
Dói saber que eu te magoei.
Dói saber que fui eu quem causou algo ruim em você.
Porque, se tem uma coisa que eu nunca quis ser na sua vida…
foi alguém que tirasse sua paz.
Eu errei.
E hoje eu consigo olhar pra isso com mais maturidade.
Não foi só pelo que aconteceu naquele domingo…
mas também pelo que aconteceu ontem.
Sobre aquilo da foto…
eu quero ser muito sincero com você.
Aquilo não significou nada pra mim.
Não tinha sentimento, não tinha interesse, não tinha intenção de nada com aquela pessoa.
Foi algo automático, vazio…
sem importância pra mim.
Mas eu entendi que, pra você, não foi assim.
Principalmente pelo contexto de tudo.
Você estava se aproximando,
a gente estava se conectando mais,
você estava com vontade de vir me ver…
E aí, junto com o que já tinha acontecido no domingo,
aquilo acabou pesando muito mais pra você.
E eu consigo entender isso hoje.
Porque não é só sobre a foto…
é sobre o que ela representou naquele momento.
Talvez tenha parecido desrespeito.
Talvez tenha parecido falta de consideração.
Talvez tenha te feito se sentir menos importante.
E isso… é o que mais me dói.
Porque você não merece se sentir assim.
Muito menos por minha causa.
E foi aí que eu aprendi algo importante:
Não importa se pra mim não teve significado…
se pra você teve impacto, então isso importa.
E importa muito.
E por isso, eu te peço desculpa.
De verdade.
Sem tentar justificar.
Sem tentar minimizar.
Sem tentar me defender.
Só reconhecendo.
Eu queria ter tido mais consciência naquele momento.
Queria ter pensado mais.
Queria ter cuidado mais do que você sente.
Mas já que eu não posso voltar…
eu escolho fazer diferente daqui pra frente.
Porque você merece isso.
Você merece alguém que te respeite.
Que te considere.
Que pense antes de agir.
Que cuide do seu sentimento.
E eu quero ser essa pessoa.
Não só falando…
mas provando.
Você nunca foi um peso.
Nunca foi um problema.
Você sempre foi leve.
Você foi companhia.
Foi presença.
Foi alguém que melhorou meus dias de forma sincera.
E é por isso que pensar em te perder…
mesmo que aos poucos…
me assusta de verdade.
Porque você se tornou especial pra mim.
Muito mais do que talvez eu tenha conseguido demonstrar.
Desde o dia que eu te conheci, eu percebi uma coisa:
a vida pode surpreender.
E você foi essa surpresa pra mim.
Talvez agora você esteja magoada.
Distante.
Confusa.
E eu entendo.
Mas eu precisava te dizer que…
do meu lado… isso ainda faz sentido.
Eu ainda acredito na gente.
E mais do que acreditar…
eu estou disposto a mostrar isso com atitudes.
Eu não quero só falar bonito.
Eu quero agir diferente.
Quero aprender com isso.
Quero crescer.
Porque gostar de alguém também é isso:
é reconhecer erro, evoluir e não desistir fácil.
Eu quero te ver.
Quero te encontrar de verdade.
Quero estar perto de você.
Quero te dar um abraço daqueles que dizem tudo sem precisar falar.
Quero viver coisas simples… mas reais.
Você é importante pra mim.
Muito importante.
E nada disso aqui é exagero.
É só verdade.
Se você chegou até aqui…
talvez ainda exista algo.
E se existir…
eu quero cuidar disso com tudo que eu tenho.
Sem repetir os mesmos erros.
De verdade.

Me responda quando terminar ❤️

— Gabriel`;

// escrever carta na hora
function escreverCarta(){
 let el=document.getElementById("carta");
 el.style.display="block";
 el.innerHTML="";
 let i=0;
 function digitar(){
  if(i<cartaTexto.length){
   el.innerHTML+=cartaTexto.charAt(i);
   i++;
   setTimeout(digitar,25);
  }
 }
 digitar();
}

// ação principal
function abrirTudo(){
 escreverCarta();

 document.getElementById("brokenHeart").style.display="block";

 if(navigator.vibrate){
  navigator.vibrate([200,100,200]);
 }

 document.getElementById("voz").play();
}

// poema inicial
const poemText=`Maria Eduarda...

Se em um ato pudesse dizer te amo,
Perdir perdão pelas falhas humanas,
Iria passar ao seu lado mais que ano,
Trocar todas as vaidades mundanas,

Pediria um abraço apertado,
Esperando um não sincero,
Roubaria um beijo molhado,
Sentindo o sabor - "Te quero".

Se palavras forem muito,
Mudo irei me tornar,
Se preciso for gritaria ao mundo,
Me lugar e no seu olhar,

Mesmo longe e distante, 
Quero poder ter você, 
Compartilhar cada instante,
Cada dádiva e prazer.

Te amo ❤️.`;

let p=0;
function typing(){
 if(p<poemText.length){
 document.getElementById("poem").innerHTML+=poemText.charAt(p);
 p++;
 setTimeout(typing,40);
 }
}
typing();

// corações
function heart(){
 let h=document.createElement("div");
 h.className="heart";
 h.innerHTML="❤";
 h.style.left=Math.random()*100+"vw";
 h.style.fontSize=(Math.random()*50+10)+"px";
 h.style.animationDuration=(Math.random()*5+3)+"s";
 document.body.appendChild(h);
 setTimeout(()=>h.remove(),8000);
}
setInterval(heart,200);

// cupido
function cupid(){
 let c=document.createElement("div");
 c.className="cupid";
 c.innerHTML="🏹💘";
 document.body.appendChild(c);
 setTimeout(()=>c.remove(),6000);
}
setInterval(cupid,4000);

// chuva leve
function rain(){
 let r=document.createElement("div");
 r.className="rain";
 r.style.left=Math.random()*100+"vw";
 document.body.appendChild(r);
 setTimeout(()=>r.remove(),1000);
}
setInterval(rain,100);

</script>

</body>
</html>
